name: Deploy Vault to GitHub Pages

# Two jobs, as in GitHub's own Pages workflow template:
#   build  — checks, tests, then uploads docs/ as the "github-pages" artifact;
#   deploy — publishes that artifact.
# They used to be one job. The deploy step then asked for the artifact moments
# after uploading it and sometimes got "No artifacts named github-pages were
# found" (runs for PR #50 and #54). Once the build job has finished, its artifact
# is complete and visible, so the deploy job no longer races the upload.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Vault deployment enablement — ensures Pages is active and onboarding is verified
env:
  VAULT_ENABLEMENT: "true"
  VAULT_ONBOARDING_REQUIRED: "true"
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify frontend structure (core)
        run: |
          echo "Checking docs folder..."
          ls -la docs/
          test -f docs/index.html || (echo "docs/index.html missing!" && exit 1)
          test -f docs/config.js || (echo "docs/config.js missing!" && exit 1)
          test -f docs/404.html || (echo "docs/404.html missing!" && exit 1)
          test -f docs/manifest.json || (echo "manifest.json missing!" && exit 1)
          echo "Core frontend structure OK"

      - name: Verify onboarding wizard (7 steps)
        run: |
          echo "Checking onboarding flow..."
          test -f docs/js/onboarding.js || (echo "docs/js/onboarding.js missing! Onboarding wizard required." && exit 1)
          test -f docs/css/onboarding.css || (echo "docs/css/onboarding.css missing! Onboarding styles required." && exit 1)
          test -f docs/js/api.js || (echo "api.js missing!" && exit 1)
          
          # Check that onboarding is referenced in index.html
          grep -q "onboarding.css" docs/index.html || (echo "onboarding.css not linked in index.html" && exit 1)
          grep -q "js/main.js" docs/index.html || (echo "js/main.js not loaded by index.html" && exit 1)
          grep -q "onboarding.js" docs/js/main.js || (echo "onboarding.js not imported in js/main.js" && exit 1)
          grep -q "onboarding-host" docs/index.html || (echo "onboarding-host not found in index.html" && exit 1)
          
          # Verify the 7 steps are implemented (6 = Terms of Use, 7 = Ready to Launch)
          grep -q "totalSteps = 7" docs/js/onboarding.js || (echo "onboarding wizard should have 7 steps" && exit 1)
          grep -q "bindTermsStep" docs/js/onboarding.js || (echo "Terms of Use step missing from the onboarding wizard" && exit 1)
          test -f docs/terms.html || (echo "docs/terms.html missing!" && exit 1)
          echo "Onboarding wizard verification OK — 7 steps present"

      - name: Verify backend setup routes
        run: |
          echo "Checking backend setup routes..."
          test -f server/routes/setup.js || (echo "server/routes/setup.js missing! Backend setup routes required." && exit 1)
          grep -q "/api/setup/status" server/routes/setup.js || (echo "setup status route missing" && exit 1)
          grep -q "/api/setup/complete" server/routes/setup.js || (echo "setup complete route missing" && exit 1)
          grep -q "enablement" server/routes/setup.js || (echo "enablement flag missing in setup routes" && exit 1)
          grep -q "enablement" server/config.js || (echo "enablement flag missing in config" && exit 1)
          
          # Check that setup route is mounted in index.js
          grep -q "api/setup" server/index.js || (echo "setup route not mounted in server/index.js" && exit 1)
          
          echo "Backend setup routes OK — enablement: true"

      - name: Validate deploy enablement
        run: |
          echo "Validating deployment enablement..."
          echo "VAULT_ENABLEMENT=${VAULT_ENABLEMENT}"
          if [ "${VAULT_ENABLEMENT}" != "true" ]; then
            echo "Deployment disabled — VAULT_ENABLEMENT must be true"
            exit 1
          fi
          echo "✓ Deployment enablement: true"
          echo "✓ Onboarding enablement: true"
          echo "✓ GitHub Pages deployment ready"

      - name: Lint (syntax + import graph)
        run: |
          node scripts/syntax-check.js
          node scripts/import-check.js
          node scripts/build-preload.js --check

      - name: Server tests
        working-directory: server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Validate bundled CSS is up to date
        run: |
          node scripts/build-css.js
          git diff --exit-code docs/css/vault.css || (echo "vault.css is stale — run npm run build:css" && exit 1)

      - name: Optional build step
        run: |
          echo "No build required - vanilla JS SPA with onboarding"
          echo "Files to deploy:"
          ls -lh docs/
          echo "--- JS ---"
          ls -lh docs/js/
          echo "--- CSS ---"
          ls -lh docs/css/
          echo "Frontend ready for Pages"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # GitHub's Pages/Actions API is occasionally unavailable for a moment
      # ("Fetching artifact metadata failed … re-run the deployment at a later
      # time"). Try once more after a pause instead of failing the deploy.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
