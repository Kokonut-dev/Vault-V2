name: Deploy Vault to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frontend structure
        run: |
          echo "Checking docs folder..."
          ls -la docs/
          test -f docs/index.html || (echo "docs/index.html missing!" && exit 1)
          test -f docs/config.js || (echo "docs/config.js missing!" && exit 1)
          echo "Frontend structure OK"

      - name: Optional build step (minify if needed)
        run: |
          # No build required for vanilla JS, but we can minify CSS/JS optionally
          # For now, just ensure files exist
          echo "No build step required - vanilla JS SPA"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
